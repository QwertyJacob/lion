<title>Synthetic LION – Information Flow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

    position: fixed; background: #1e293b; border: 1px solid #334155;

  }
  .tt strong { color: #93c5fd; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: center; margin-top: 20px; }
  .leg-item { display: flex; align-items: center; gap: 7px; font-size: .78rem; color: #475569; }
  .leg-dot  { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }
</style>
</head>
<body>

<!--
  LAYOUT  (viewBox 1280 × 840)
  Left column  35% → x=12, w=428  (Data Gen zone + State Builder zone)
  Right column 65% → x=452, w=816 (Inference Module)
  Below both: Agent zone (x=12,w=838) + Buffer zone (x=862,w=406)
  Bottom: Outcomes zone (x=12,w=1256)
-->

<svg id="diagram" viewBox="0 0 1280 840" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="m-grey"   markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#475569"/></marker>
  <marker id="m-blue"   markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#1d4ed8"/></marker>
  <marker id="m-green"  markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#15803d"/></marker>
  <marker id="m-orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#c2410c"/></marker>
  <marker id="m-purple" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#7c3aed"/></marker>
  <marker id="m-amber"  markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#b45309"/></marker>
  <marker id="m-red"    markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#b91c1c"/></marker>
  <marker id="m-pink"   markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#a21caf"/></marker>
  <marker id="m-sky"    markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#0369a1"/></marker>
  <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.30"/></filter>
</defs>

<!-- ══════════════════ ZONE BACKGROUNDS ══════════════════ -->

<!-- Data Generation  (35% column, top) -->
<rect x="12"  y="12"  width="428" height="158" rx="10"
      fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" stroke-dasharray="6,3"/>
<text x="226" y="32" text-anchor="middle" font-size="13" fill="#64748b" font-weight="700" letter-spacing=".07em">DATA GENERATION</text>

<!-- Inference Module  (65% column) -->
<rect x="452" y="12"  width="816" height="346" rx="10"
      fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.4" stroke-dasharray="6,3"/>
<text x="860" y="32" text-anchor="middle" font-size="13" fill="#64748b" font-weight="700" letter-spacing=".07em">INFERENCE MODULE</text>

<!-- Prototype Store  (inside inference, right side) -->
<rect x="796" y="40"  width="462" height="270" rx="8"
      fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="1027" y="58" text-anchor="middle" font-size="11" fill="#166534" font-weight="700">PROTOTYPE STORE</text>

<!-- State Builder  (35% column, below data gen) -->
<rect x="12"  y="182" width="428" height="186" rx="10"
      fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.4" stroke-dasharray="6,3"/>
<text x="226" y="202" text-anchor="middle" font-size="13" fill="#64748b" font-weight="700" letter-spacing=".07em">STATE BUILDER</text>

<!-- Agent zone -->
<rect x="12"  y="380" width="838" height="244" rx="10"
      fill="#fafafa" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="6,3"/>
<text x="431" y="400" text-anchor="middle" font-size="13" fill="#64748b" font-weight="700" letter-spacing=".07em">AGENT</text>

<!-- Experience Buffer zone -->
<rect x="862" y="380" width="406" height="244" rx="10"
      fill="#fdf4ff" stroke="#e879f9" stroke-width="1.4" stroke-dasharray="6,3"/>
<text x="1065" y="400" text-anchor="middle" font-size="13" fill="#64748b" font-weight="700" letter-spacing=".07em">EXPERIENCE BUFFER</text>

<!-- Outcomes -->
<rect x="12"  y="638" width="1256" height="188" rx="10"
      fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="6,3"/>
<text x="640" y="658" text-anchor="middle" font-size="13" fill="#64748b" font-weight="700" letter-spacing=".07em">ACTION OUTCOMES</text>

<!-- ══════════════════ NODES ══════════════════ -->

<!-- Data Generator  (cx=226, y=38–96) -->
<g class="node" data-tip="<strong>Data Generator</strong><br>Samples one flow per step from 7 two-dimensional Gaussians.<br><b>Known (pre-trained):</b> K0 benign, K1 benign, K2 malicious.<br><b>Unknown (label required):</b> A malicious (overlaps K0), B malicious, C benign, D benign (near K2).<br>Returns: raw 2D point, class ID, is-known flag, unknown cluster ID.">
  <rect x="22" y="38" width="408" height="58" rx="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/>
  <text x="226" y="62"  text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Data Generator</text>
  <text x="226" y="82"  text-anchor="middle" font-size="12" fill="#1d4ed8">7 Gaussian clusters (2D)  ·  3 known + 4 unknown</text>
</g>

<!-- Encoder  (cx=562, y=38–96) -->
<g class="node" data-tip="<strong>Encoder</strong><br>Two-layer MLP: Linear(2→48) → ReLU → Linear(48→24).<br>Pre-trained on the three known classes using prototypical loss (120 epochs).<br>Projects the raw 2D point into a 24-dimensional hidden space.">
  <rect x="462" y="38" width="320" height="58" rx="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/>
  <text x="622" y="62"  text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Encoder</text>
  <text x="622" y="82"  text-anchor="middle" font-size="12" fill="#1d4ed8">MLP  2 → 48 → 24  (pre-trained)  →  hidden vector h</text>
</g>

<!-- is_known diamond  center(622, 162)  hw=46 hh=34 -->
<g class="node" data-tip="<strong>Known-class branch</strong><br>Routes the hidden vector based on whether the current flow belongs to a known class.<br>Yes → Known Classifier only.<br>No → Anomaly Detector + Unknown Cluster Head.">
  <polygon points="622,128 668,162 622,196 576,162" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="622" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">known</text>
  <text x="622" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">class?</text>
</g>

<!-- Known Classifier  (cx=726, y=60–116) -->
<g class="node" data-tip="<strong>Known Classifier</strong><br>Computes L2 distances from h to every row of Known Prototypes.<br>Applies softmax(−distance × τ, τ=3.0) → class probabilities.<br>Returns: predicted class, confidence, distance vector.">
  <rect x="690" y="60" width="96" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="738" y="82"  text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">Known</text>
  <text x="738" y="98"  text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">Classifier</text>
  <text x="738" y="112" text-anchor="middle" font-size="10" fill="#0369a1">L2 → softmax</text>
</g>

<!-- Anomaly Detector  (cx=726, y=134–182) -->
<g class="node" data-tip="<strong>Anomaly Detector</strong><br>Anomaly score = min distance to any known prototype.<br>A flow is anomalous when score > δ = 1.8.<br>Normalised score fills one slot of the exteroceptive state.">
  <rect x="690" y="134" width="96" height="48" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="738" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">Anomaly</text>
  <text x="738" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">Detector</text>
</g>

<!-- Unknown Cluster Head  (cx=726, y=204–268) -->
<g class="node" data-tip="<strong>Unknown Cluster Head</strong><br>Runs for unknown flows only.<br>Soft-assigns flow to one of 4 unknown clusters via softmax(−dist × τ).<br>Updates the matched Unknown Prototype row via EMA (α = 0.08); updates Cluster Confidence.">
  <rect x="690" y="204" width="96" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
  <text x="738" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">Unknown</text>
  <text x="738" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">Cluster Head</text>
  <text x="738" y="254" text-anchor="middle" font-size="10" fill="#0369a1">soft-assign → EMA</text>
</g>

<!-- Known Prototypes  (cx=1027, y=66–130) -->
<g class="node" data-tip="<strong>Known Prototypes (learnable parameter)</strong><br>Shape: (n_known × 24). Initially 3 rows (K0, K1, K2).<br>Grows by one row each time a label is purchased — the EMA cluster prototype is promoted here.<br>Updated by back-propagation during pre-training only.">
  <rect x="806" y="66" width="440" height="58" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2" filter="url(#sh)"/>
  <text x="1026" y="90"  text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Known Prototypes</text>
  <text x="1026" y="112" text-anchor="middle" font-size="12" fill="#15803d">Learnable parameter  ·  shape (n_known × 24)</text>
</g>

<!-- Unknown Prototypes  (cx=1027, y=142–200) -->
<g class="node" data-tip="<strong>Unknown Prototypes (EMA buffer — no gradient)</strong><br>Shape: (4 × 24). Updated online via EMA (α = 0.08).<br>Not trained by back-propagation.<br>When a label is purchased for cluster u, row u is promoted to Known Prototypes.">
  <rect x="806" y="142" width="440" height="58" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" filter="url(#sh)"/>
  <text x="1026" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Unknown Prototypes</text>
  <text x="1026" y="186" text-anchor="middle" font-size="12" fill="#c2410c">EMA buffer (no gradient)  ·  shape (4 × 24),  α = 0.08</text>
</g>

<!-- Cluster Confidence  (cx=1027, y=218–270) -->
<g class="node" data-tip="<strong>Cluster Confidence (EMA buffer)</strong><br>4 running EMA assignment scores, one per unknown cluster.<br>Used directly as 4 of the 9 proprioceptive state dimensions.<br>Zeroed immediately on label purchase → sharpest one-step proprioceptive change → max epistemic gain.">
  <rect x="806" y="218" width="440" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>
  <text x="1026" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Cluster Confidence</text>
  <text x="1026" y="261" text-anchor="middle" font-size="12" fill="#6d28d9">EMA buffer (4D)  ·  zeroed on label purchase</text>
</g>

<!-- Exteroceptive  (cx=120, y=212–278, left half of state builder) -->
<g class="node" data-tip="<strong>Exteroceptive sub-vector (5D)</strong><br>[0] Predicted class (normalised)<br>[1] Classifier confidence<br>[2] Anomaly score (normalised)<br>[3–4] Raw input coordinates ÷ 5<br>Encodes the observable properties of the current flow.">
  <rect x="22" y="212" width="198" height="72" rx="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/>
  <text x="121" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Exteroceptive</text>
  <text x="121" y="255" text-anchor="middle" font-size="12" fill="#1d4ed8">(5D)</text>
  <text x="121" y="274" text-anchor="middle" font-size="11" fill="#1e3a8a">class · conf · anomaly · coords</text>
</g>

<!-- Proprioceptive  (cx=331, y=212–278, right half of state builder) -->
<g class="node" data-tip="<strong>Proprioceptive sub-vector (9D)</strong><br>[0–3] Cluster Confidence per unknown cluster<br>[4] Labels purchased fraction<br>[5] Budget fraction<br>[6] Current cluster price fraction<br>[7] Time fraction<br>[8] Classifier confidence (repeated)<br>Encodes the agent's internal / epistemic situation.">
  <rect x="230" y="212" width="200" height="72" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>
  <text x="330" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Proprioceptive</text>
  <text x="330" y="255" text-anchor="middle" font-size="12" fill="#7c3aed">(9D)</text>
  <text x="330" y="274" text-anchor="middle" font-size="11" fill="#4c1d95">cluster conf · budget · price · time</text>
</g>

<!-- State vector  (cx=226, y=302–344) -->
<g class="node" data-tip="<strong>State vector (14D)</strong><br>Concatenation of exteroceptive (5D) and proprioceptive (9D) sub-vectors.<br>Fed to the Two-Stream Network at every step.">
  <rect x="22" y="302" width="408" height="44" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.8" filter="url(#sh)"/>
  <text x="226" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">State vector  (14D)  =  exteroceptive ‖ proprioceptive</text>
</g>

<!-- Two-Stream Network  (cx=116, y=414–478) -->
<g class="node" data-tip="<strong>Two-Stream Network</strong><br>Shared backbone for all learned agents.<br>Perception stream: Linear(5→48)→ReLU×2  ·  Internal stream: Linear(9→48)→ReLU×2<br>Concatenated (96D) → projected to output dim.<br>Output: Q-values (DDQN, Dueling, DAI) or policy logits (PPO, SAC).">
  <rect x="22" y="414" width="188" height="64" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.8" filter="url(#sh)"/>
  <text x="116" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Two-Stream</text>
  <text x="116" y="457" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Network</text>
  <text x="116" y="473" text-anchor="middle" font-size="11" fill="#475569">perception + internal stream</text>
</g>

<!-- Action diamond  center(286,484)  hw=50 hh=40 -->
<g class="node" data-tip="<strong>Action selection</strong><br>Action space: block (0), accept (1), buy label (2).<br>DDQN / Dueling: ε-greedy argmax Q.  DAI: Boltzmann(β=100) over EFE.  PPO: sample from actor.  SAC: max-entropy Categorical.">
  <polygon points="286,444 336,484 286,524 236,484" fill="#fffbeb" stroke="#b45309" stroke-width="2.2"/>
  <text x="286" y="479" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">action</text>
  <text x="286" y="495" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">select</text>
</g>

<!-- Transition Network  (cx=464, y=414–478) -->
<g class="node" data-tip="<strong>Transition Network (DAI-P, DAI-A, DAI-F only)</strong><br>Linear(17→48)→ReLU→Linear(48→48)→ReLU→Linear(48→9)<br>Predicts next proprioceptive sub-vector from (state, one-hot action).<br>Epistemic gain = 0.5 × ‖actual next proprio − predicted‖²<br>Label purchase zeroes cluster confidence[u] → maximum prediction error → maximum epistemic gain.">
  <rect x="360" y="414" width="208" height="64" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8" filter="url(#sh)"/>
  <text x="464" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Transition</text>
  <text x="464" y="457" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Network</text>
  <text x="464" y="473" text-anchor="middle" font-size="11" fill="#7c3aed">predicts next internal state</text>
</g>

<!-- EFE Network  (cx=654, y=414–478) -->
<g class="node" data-tip="<strong>EFE Network (DAI variants)</strong><br>Two-Stream Net → 3 Expected Free Energy values (one per action).<br>Policy: Boltzmann softmax with precision β=100.<br>Target: EFE(s,a) = reward + epistemic_gain + γ × EFE(s′,a*).<br>Hard-copied target network updated every 20 gradient steps.">
  <rect x="582" y="414" width="218" height="64" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8" filter="url(#sh)"/>
  <text x="691" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">EFE Network</text>
  <text x="691" y="459" text-anchor="middle" font-size="12" fill="#0369a1">Two-Stream → 3 EFE values</text>
  <text x="691" y="474" text-anchor="middle" font-size="11" fill="#0c4a6e">Boltzmann policy  (β = 100)</text>
</g>

<!-- Experience Buffer  (cx=1065, y=414–478) -->
<g class="node" data-tip="<strong>Experience Buffer</strong><br><b>Off-policy agents (DDQN, Dueling, SAC, DAI variants):</b> circular replay buffer, capacity 6,000. Stores (state, action, reward, next state, done). Mini-batches of 64 sampled randomly. Persists across episodes.<br><b>On-policy (PPO):</b> episode rollout buffer storing (state, action, reward, log-prob, value). Cleared after each episode once GAE advantage estimates and gradient epochs are computed.">
  <rect x="872" y="414" width="384" height="64" rx="9" fill="#fae8ff" stroke="#a21caf" stroke-width="2" filter="url(#sh)"/>
  <text x="1064" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#701a75">Experience Buffer</text>
  <text x="1064" y="460" text-anchor="middle" font-size="12" fill="#a21caf">replay (off-policy)  ·  rollout (on-policy / PPO)</text>
  <text x="1064" y="475" text-anchor="middle" font-size="11" fill="#701a75">capacity 6,000  ·  batch 64  ·  cleared per episode (PPO)</text>
</g>

<!-- ── Outcome nodes ── -->
<g class="node" data-tip="<strong>Block  (action = 0)</strong><br>Flow rejected. Reward depends on class and whether a label has been purchased.<br>Known benign = −2.5  ·  Known malicious = +2.5<br>Unlabelled unknown: A = +0.5, B = +1.5, C = −1.5, D = −1.0.">
  <rect x="22"  y="668" width="174" height="58" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" filter="url(#sh)"/>
  <text x="109" y="692" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Block</text>
  <text x="109" y="709" text-anchor="middle" font-size="12" fill="#b91c1c">action = 0</text>
</g>

<g class="node" data-tip="<strong>Accept  (action = 1)</strong><br>Flow forwarded. Reward depends on class and label status.<br>Known benign = +2.0  ·  Known malicious = −5.0<br>Unlabelled unknown: A = −7.0, B = −3.5, C = +0.5, D = +0.5.">
  <rect x="208" y="668" width="174" height="58" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="2" filter="url(#sh)"/>
  <text x="295" y="692" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Accept</text>
  <text x="295" y="709" text-anchor="middle" font-size="12" fill="#15803d">action = 1</text>
</g>

<g class="node" data-tip="<strong>Buy Label  (action = 2, if valid)</strong><br>Purchases a CTI label for the current unknown cluster u.<br>Valid when: flow is unknown, label not yet bought, budget ≥ price[u].<br>On success: cluster prototype promoted to Known Prototypes; cluster confidence[u] zeroed; budget debited.">
  <rect x="394" y="668" width="174" height="58" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="2" filter="url(#sh)"/>
  <text x="481" y="692" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Buy Label</text>
  <text x="481" y="709" text-anchor="middle" font-size="12" fill="#b45309">action = 2  (if valid)</text>
</g>

<g class="node" data-tip="<strong>Prototype Promotion</strong><br>Triggered by a valid label purchase for cluster u:<br>1. EMA prototype row u copied into Known Prototypes (grows by 1 row).<br>2. Cluster confidence[u] zeroed — sharpest one-step proprioceptive change.<br>3. Future flows from cluster u classified as known and rewarded accordingly.">
  <rect x="580" y="668" width="258" height="58" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#sh)"/>
  <text x="709" y="691" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Prototype Promotion</text>
  <text x="709" y="709" text-anchor="middle" font-size="12" fill="#b45309">cluster prototype → Known Protos  ·  conf[u] ← 0</text>
</g>

<g class="node" data-tip="<strong>Invalid Purchase</strong><br>Triggered when buy-label attempted but:<br>(a) flow is a known class, or (b) label already purchased, or (c) budget &lt; price.<br>Penalty = −0.3. No prototype or state changes.">
  <rect x="852" y="668" width="178" height="58" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="941" y="691" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Invalid Purchase</text>
  <text x="941" y="709" text-anchor="middle" font-size="12" fill="#b91c1c">penalty = −0.3</text>
</g>

<g class="node" data-tip="<strong>Episode End</strong><br>Terminates after 30 steps or when cumulative reward ≥ 40.<br>Off-policy agents: Replay Buffer persists; Inference Module resets.<br>PPO: Rollout buffer cleared and gradient update applied.">
  <rect x="1044" y="668" width="212" height="58" rx="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/>
  <text x="1150" y="691" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Episode End</text>
  <text x="1150" y="709" text-anchor="middle" font-size="12" fill="#1d4ed8">30 steps  or  reward ≥ 40</text>

<script>
  const tt = document.getElementById('tooltip');
  document.querySelectorAll('.node').forEach(g => {
    g.style.cursor = 'pointer';
    g.addEventListener('mouseenter', () => { tt.style.display = 'block'; tt.innerHTML = g.dataset.tip; });
    g.addEventListener('mousemove', e => { tt.style.left = (e.clientX+14)+'px'; tt.style.top = (e.clientY-10)+'px'; });
    g.addEventListener('mouseleave', () => { tt.style.display = 'none'; });
  });
</script>
